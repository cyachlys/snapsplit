<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SplitWoi!">
<meta name="theme-color" content="#fbf6f8">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%23c6ff3d'/><text x='50%' y='68%' font-size='55' font-weight='bold' text-anchor='middle' font-family='sans-serif'>⚡</text></svg>">
<title>SplitWoi!</title>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg: #f8f5ee;
  --card: #ffffff;
  --card-sub: #f3efe6;
  --ink: #19191d;
  --mute: #727068;
  --line: #202024;
  --acc: #c6ff3d;
  --pink: #ff5fa2;
  --cyan: #3bc9db;
  --amber: #ffa94d;
  --purple: #b197fc;
  --shadow: 3px 3px 0 var(--ink);
  --shadow-sm: 2px 2px 0 var(--ink);
  --shadow-lg: 5px 5px 0 var(--ink);
  --r: 18px;
  --font: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  --mono: 'DM Mono', ui-monospace, monospace;
}

[data-theme="dark"] {
  --bg: #111114;
  --card: #1c1c22;
  --card-sub: #26262e;
  --ink: #f5f4ef;
  --mute: #9e9c93;
  --line: #3c3c46;
  --shadow: 3px 3px 0 #000000;
  --shadow-sm: 2px 2px 0 #000000;
  --shadow-lg: 5px 5px 0 #000000;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.5 var(--font);
  overflow-x: hidden;
  transition: background 0.25s ease, color 0.25s ease;
}

/* Animations */
@keyframes wave {
  0%, 100% { transform: rotate(0deg); }
  20%, 60% { transform: rotate(14deg); }
  40%, 80% { transform: rotate(-10deg); }
}

@keyframes popIn {
  0% { opacity: 0; transform: translateY(16px) scale(0.97); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes slideDownFade {
  0% { opacity: 0; transform: translateY(-12px); }
  100% { opacity: 1; transform: translateY(0); }
}

@keyframes pulseGlow {
  0%, 100% { transform: scale(1); box-shadow: 0 0 0 rgba(198,255,61,0); }
  50% { transform: scale(1.02); box-shadow: 0 0 16px rgba(198,255,61,0.45); }
}

@keyframes laserMove {
  0% { top: 0%; opacity: 0.8; }
  50% { top: 92%; opacity: 1; }
  100% { top: 0%; opacity: 0.8; }
}

.anim-pop { animation: popIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) both; }
.anim-wave { display: inline-block; transform-origin: 70% 70%; animation: wave 1.8s ease-in-out infinite; }
.logo-badge {
  width: 84px; height: 84px;
  margin: 0 auto 6px;
  border-radius: 24px;
  width: 64px; height: 64px;
  margin: 0 auto 6px;
  border-radius: 18px;
  background: var(--acc);
  border: 2px solid var(--line);
  box-shadow: 4px 4px 0 var(--line);
  display: flex; align-items: center; justify-content: center;
  font-size: 44px; color: #111;
  font-size: 32px; color: #111;
  animation: logoFloat 3s ease-in-out infinite;
}
@keyframes logoFloat {
  0%, 100% { transform: translateY(0) rotate(-4deg); }
  50%      { transform: translateY(-8px) rotate(4deg); }
}
@media (prefers-reduced-motion: reduce) {
  .logo-badge { animation: none; }
}

html {
  -webkit-text-size-adjust: 100%;
}
body {
  padding-bottom: env(safe-area-inset-bottom);
}
main {
  max-width: 740px;
  margin: 0 auto;
  padding: 18px 18px calc(115px + env(safe-area-inset-bottom));
}
@supports (-webkit-touch-callout: none) {
  /* iOS specific smooth scrolling */
  body {
    -webkit-overflow-scrolling: touch;
  }
}

/* Header & Top Bar */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  padding: 4px 0;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  user-select: none;
  text-decoration: none;
}
.brand-logo {
  font-size: 1.5rem;
  font-weight: 800;
  letter-spacing: -0.04em;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 4px;
}
.brand-badge {
  background: var(--acc);
  color: #111;
  font-size: 0.72rem;
  font-weight: 800;
  padding: 2px 7px;
  border-radius: 99px;
  border: 1.5px solid var(--line);
  box-shadow: 1px 1px 0 var(--line);
  text-transform: uppercase;
}
.top-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.icon-btn {
  background: var(--card);
  border: 1.5px solid var(--line);
  color: var(--ink);
  width: 38px;
  height: 38px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 1rem;
  box-shadow: var(--shadow-sm);
  transition: transform 0.12s, box-shadow 0.12s;
}
.icon-btn:hover {
  transform: translate(-1px, -1px);
  box-shadow: var(--shadow);
}
.icon-btn:active {
  transform: translate(2px, 2px);
  box-shadow: 0 0 0 transparent;
}

/* Typography & Cards */
h1, h2, h3 {
  letter-spacing: -0.035em;
  margin: 0 0 0.5em;
  font-weight: 800;
}
h2 { font-size: 1.7rem; }
.mono { font-family: var(--mono); }

.card {
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: var(--r);
  padding: 20px;
  margin-bottom: 18px;
  box-shadow: var(--shadow);
  position: relative;
  transition: transform 0.15s, box-shadow 0.15s;
}

/* Buttons */
button, .btn {
  background: var(--ink);
  color: var(--bg);
  border: 2px solid var(--line);
  border-radius: 99px;
  padding: 11px 22px;
  font: 700 15px var(--font);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  text-decoration: none;
  box-shadow: var(--shadow-sm);
  transition: transform 0.12s, box-shadow 0.12s, background 0.15s;
  user-select: none;
}
button:hover, .btn:hover {
  transform: translate(-1px, -1px);
  box-shadow: var(--shadow);
}
button:active, .btn:active {
  transform: translate(2px, 2px);
  box-shadow: 0 0 0 transparent;
}

button.acc, .btn.acc {
  background: var(--acc);
  color: #111;
}
button.pink, .btn.pink {
  background: var(--pink);
  color: #fff;
}
button.cyan, .btn.cyan {
  background: var(--cyan);
  color: #111;
}
button.ghost {
  background: none;
  border-color: transparent;
  box-shadow: none;
  color: var(--mute);
  padding: 6px 12px;
}
button.ghost:hover {
  background: var(--card-sub);
  color: var(--ink);
  transform: none;
  box-shadow: none;
}
button.ghost.danger {
  color: var(--pink);
}
button.ghost.danger:hover {
  background: rgba(255, 95, 162, 0.15);
}

/* Inputs & Forms */
input, select, textarea {
  width: 100%;
  padding: 12px 14px;
  border-radius: 14px;
  border: 2px solid var(--line);
  background: var(--card-sub);
  color: var(--ink);
  font: 500 16px var(--font) !important; /* 16px prevents iOS Safari auto-zoom */
  margin: 6px 0 12px;
  outline: none;
  transition: border-color 0.15s, background 0.15s;
}
input:focus, select:focus {
  border-color: var(--pink);
  background: var(--card);
}
label {
  color: var(--mute);
  font-size: 0.88rem;
  font-weight: 700;
  display: block;
}

/* Grids & Metrics */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 14px;
}
.stat {
  padding: 16px;
  background: var(--card);
}
.stat-icon {
  font-size: 1.4rem;
  margin-bottom: 6px;
  display: inline-block;
}
.stat span {
  color: var(--mute);
  font-size: 0.82rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  display: block;
}
.stat b {
  display: block;
  font-size: 1.55rem;
  font-weight: 800;
  letter-spacing: -0.03em;
  margin-top: 4px;
  font-family: var(--mono);
}

/* Floating Bottom Navigation */
nav[hidden] { display: none; }
nav {
  position: fixed;
  bottom: calc(14px + env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--ink);
  padding: 7px 10px;
  border-radius: 99px;
  border: 2px solid var(--line);
  box-shadow: var(--shadow-lg);
  z-index: 99;
}
nav a {
  color: var(--bg);
  padding: 9px 18px;
  border-radius: 99px;
  text-decoration: none;
  font-weight: 700;
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 7px;
  transition: background 0.18s, color 0.18s, transform 0.15s;
}
nav a:hover {
  transform: translateY(-1px);
}
nav a.on {
  background: var(--acc);
  color: #111;
  box-shadow: 0 2px 8px rgba(198,255,61,0.4);
}

/* Chips & Multi-select */
.chips {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 6px 0 12px;
}
.chip {
  background: var(--card-sub);
  border: 2px solid var(--line);
  color: var(--ink);
  padding: 6px 14px;
  font-size: 13.5px;
  font-weight: 700;
  border-radius: 99px;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: all 0.12s;
  user-select: none;
}
.chip:hover {
  transform: translate(-1px, -1px);
}
.chip.on {
  background: var(--pink);
  border-color: var(--line);
  color: #fff;
  transform: scale(1.03);
}

/* Lists & Rows */
.li {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 14px 0;
  border-bottom: 2px dashed var(--line);
}
.li:last-child { border: 0; }
.tag {
  background: var(--pink);
  color: #fff;
  border: 1.5px solid var(--line);
  border-radius: 99px;
  font-size: 11px;
  font-weight: 800;
  padding: 2px 8px;
  margin-left: 8px;
  text-transform: uppercase;
}
.tag.alt {
  background: var(--cyan);
  color: #111;
}

/* Bars & Charts */
.bar-track {
  background: var(--card-sub);
  border: 1.5px solid var(--line);
  border-radius: 99px;
  height: 18px;
  overflow: hidden;
  position: relative;
  display: flex;
  align-items: center;
}
.bar-fill {
  height: 100%;
  border-radius: 99px;
  background: var(--acc);
  border-right: 1.5px solid var(--line);
  transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1);
  min-width: 4px;
}
.bar-row {
  display: grid;
  grid-template-columns: 85px 1fr auto;
  align-items: center;
  gap: 12px;
  margin: 10px 0;
  font-size: 0.92rem;
}

/* Toast Messages - SplitWoi! */
#toast-box {
  position: fixed;
  top: 18px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 99999;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  pointer-events: none;
  width: max-content;
  max-width: calc(100vw - 32px);
}
.toast {
  pointer-events: auto;
  padding: 13px 20px;
  border-radius: 16px;
  border: 2px solid var(--line);
  box-shadow: var(--shadow);
  font-weight: 700;
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  max-width: 100%;
  animation: slideDownFade 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  transition: opacity 0.25s ease, transform 0.25s ease;
}
.toast-icon {
  font-size: 22px;
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
}
.toast.success { background: var(--acc); color: #111; }
.toast.error { background: var(--pink); color: #fff; }
.toast.info { background: var(--card); color: var(--ink); }

/* ===== Receipt form: mobile-safe layout ===== */
.form-2col { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:12px; }
.form-2col > div { min-width:0; }
.form-2col input, .form-2col select { min-width:0; max-width:100%; height:50px; box-sizing:border-box; }
input[type="date"] {
  -webkit-appearance:none; appearance:none;
  text-align:left; display:block; min-width:0; max-width:100%;
  box-sizing:border-box; line-height:1.2;
}
input[type="date"]::-webkit-date-and-time-value { text-align:left; margin:0; min-height:1.2em; }
input[type="date"]::-webkit-calendar-picker-indicator { opacity:.6; }
select { -webkit-appearance:none; appearance:none; box-sizing:border-box;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 20px) 55%,calc(100% - 14px) 55%;
  background-size:6px 6px,6px 6px; background-repeat:no-repeat; padding-right:34px; }

.item-box { background:var(--card-sub); border:1.5px solid var(--line); border-radius:14px; padding:12px; margin-bottom:10px; }
.item-row > .nm { margin:0 0 8px; }
.item-nums { display:grid; grid-template-columns:72px minmax(0,1fr) auto 34px; gap:8px; align-items:end; }
.item-f { min-width:0; }
.item-f small { display:block; font-size:.68rem; font-weight:700; color:var(--mute); margin:0 0 3px 4px; text-transform:uppercase; letter-spacing:.03em; }
.item-nums input { margin:0; min-width:0; box-sizing:border-box; }
.item-f-qty input { text-align:center; padding-left:6px; padding-right:6px; }
.item-nums .itm-total { font-size:.85rem; color:var(--mute); white-space:nowrap; text-align:right; padding-bottom:14px; min-width:64px; }
.item-nums .rm { padding:4px; font-size:16px; margin-bottom:6px; align-self:end; }

@media (max-width:520px) {
  .item-nums { grid-template-columns:64px minmax(0,1fr) 34px; grid-template-areas:"q u r" "t t t"; }
  .item-f-qty { grid-area:q; } .item-f-upr { grid-area:u; }
  .item-nums .rm { grid-area:r; margin-bottom:6px; }
  .item-nums .itm-total { grid-area:t; text-align:right; padding:4px 4px 0; font-weight:700; }
}

@media (max-width: 480px) {
  #toast-box { width: calc(100vw - 32px); }
  .toast { width: 100%; justify-content: flex-start; }
}

/* Confetti Canvas */
#confetti-canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  z-index: 9999;
}

/* Entrance Hero on Dashboard */
.hero-banner {
  background: linear-gradient(135deg, var(--card) 0%, var(--card-sub) 100%);
  border: 2px solid var(--line);
  border-radius: var(--r);
  padding: 22px;
  margin-bottom: 18px;
  box-shadow: var(--shadow);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
}
.hero-greeting {
  font-size: 1.8rem;
  font-weight: 800;
  margin: 0 0 4px;
  letter-spacing: -0.04em;
}
.hero-sub {
  color: var(--mute);
  font-weight: 600;
  font-size: 0.95rem;
  margin: 0;
}
.quick-pills {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 12px;
}
.quick-pill {
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: 99px;
  padding: 6px 14px;
  font-size: 13px;
  font-weight: 700;
  color: var(--ink);
  cursor: pointer;
  text-decoration: none;
  box-shadow: var(--shadow-sm);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: transform 0.12s, box-shadow 0.12s;
}
.quick-pill:hover {
  transform: translate(-1px, -1px);
  box-shadow: var(--shadow);
  background: var(--acc);
}

/* Scanner HUD & Viewfinder */
.scanner-hud {
  border: 2px dashed var(--cyan);
  border-radius: var(--r);
  background: rgba(59, 201, 219, 0.06);
  padding: 24px;
  text-align: center;
  position: relative;
  overflow: hidden;
  margin: 14px 0;
}
.scanner-laser {
  position: absolute;
  left: 0;
  width: 100%;
  height: 3px;
  background: var(--pink);
  box-shadow: 0 0 10px var(--pink);
  animation: laserMove 2s ease-in-out infinite;
}

/* Live Split Preview Box */
.split-summary-box {
  background: var(--card-sub);
  border: 2px solid var(--line);
  border-radius: 14px;
  padding: 16px;
  margin: 14px 0;
}
.split-member-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: 99px;
  padding: 6px 14px;
  margin: 4px;
  font-weight: 700;
  font-size: 13.5px;
  box-shadow: var(--shadow-sm);
}
.split-member-pill span {
  font-family: var(--mono);
  color: var(--pink);
}

/* ============================================================
   SECRET ADMIN PANEL (VAULT & TERMINAL)
   ============================================================ */
.vault-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(15, 15, 18, 0.72);
  backdrop-filter: blur(10px);
  z-index: 10000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  animation: popIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}
[data-theme="dark"] .vault-overlay {
  background: rgba(5, 5, 8, 0.86);
}

.vault-modal {
  background: var(--card);
  color: var(--ink);
  border: 2px solid var(--line);
  border-radius: 22px;
  max-width: 820px;
  width: 100%;
  max-height: 88vh;
  overflow-y: auto;
  box-shadow: var(--shadow-lg);
  font-family: var(--font);
  padding: 26px;
  position: relative;
  transition: background 0.25s ease, color 0.25s ease;
}

.vault-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 2px dashed var(--line);
  padding-bottom: 16px;
  margin-bottom: 20px;
  gap: 12px;
  flex-wrap: wrap;
}

.vault-title {
  color: var(--ink);
  font-size: 1.25rem;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 10px;
  letter-spacing: -0.03em;
}

.vault-status-pill {
  background: var(--acc);
  color: #111;
  font-size: 11px;
  font-weight: 800;
  padding: 3px 10px;
  border-radius: 99px;
  border: 1.5px solid var(--line);
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.vault-header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.vault-panic-btn {
  background: #ff4785;
  color: #fff;
  border: 2px solid var(--line);
  border-radius: 99px;
  padding: 8px 18px;
  font: 700 13px var(--font);
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: transform 0.12s, box-shadow 0.12s;
}
.vault-panic-btn:hover {
  transform: translate(-1px, -1px);
  box-shadow: var(--shadow);
}
.vault-panic-btn:active {
  transform: translate(2px, 2px);
  box-shadow: 0 0 0 transparent;
}

/* Tabs */
.vault-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 22px;
  flex-wrap: wrap;
}
.vault-tab {
  background: var(--card-sub);
  border: 2px solid var(--line);
  color: var(--mute);
  padding: 9px 18px;
  border-radius: 12px;
  cursor: pointer;
  font: 700 14px var(--font);
  box-shadow: var(--shadow-sm);
  display: inline-flex;
  align-items: center;
  gap: 7px;
  transition: all 0.15s;
}
.vault-tab:hover {
  color: var(--ink);
  transform: translate(-1px, -1px);
}
.vault-tab.on {
  background: var(--acc);
  color: #111;
  border-color: var(--line);
  box-shadow: var(--shadow);
}

/* Overview Cards */
.vault-overview-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
  margin-bottom: 22px;
}
.vault-metric-box {
  background: var(--card-sub);
  border: 2px solid var(--line);

/* ============================================================
   AUDIO SYNTHESIZER (Pure Web Audio API - Zero External Files)
   ============================================================ */
let audioCtx = null;
let soundEnabled = localStorage.getItem('splitwoi_sound') !== 'false';

function getAudioCtx() {
  if (!audioCtx) {
    const AudioCtor = window.AudioContext || window.webkitAudioContext;
    if (AudioCtor) audioCtx = new AudioCtor();
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  return audioCtx;
}

function playSfx(type) {
  if (!soundEnabled) return;
  try {
    const ctx = getAudioCtx();
    if (!ctx) return;
    const now = ctx.currentTime;

    if (type === 'click') {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(440, now);
      osc.frequency.exponentialRampToValueAtTime(880, now + 0.05);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.05);
    } else if (type === 'cash') {
      // Cheerful dual-tone coin chime
      [987.77, 1318.51].forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now + idx * 0.08);
        gain.gain.setValueAtTime(0.15, now + idx * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.35);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + idx * 0.08);
        osc.stop(now + idx * 0.08 + 0.35);
      });
    } else if (type === 'success') {
      // Arpeggio
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + idx * 0.06);
        gain.gain.setValueAtTime(0.1, now + idx * 0.06);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.06 + 0.25);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + idx * 0.06);
        osc.stop(now + idx * 0.06 + 0.25);
      });
    } else if (type === 'scan') {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(320, now);
      osc.frequency.linearRampToValueAtTime(960, now + 0.14);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.15);
    } else if (type === 'vault') {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(140, now);
      osc.frequency.exponentialRampToValueAtTime(280, now + 0.2);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.25);
    }
  } catch (e) {
    // Audio context may require explicit user interaction on some mobile devices
  }
}

/* ============================================================
   CONFETTI CANNON (Pure Canvas 60fps)
   ============================================================ */
function fireConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  ctx.scale(dpr, dpr);

  const colors = ['#c6ff3d', '#ff5fa2', '#3bc9db', '#ffa94d', '#b197fc', '#ffffff'];
  const particles = [];
  const count = 75;

  for (let i = 0; i < count; i++) {
    particles.push({
      x: window.innerWidth * 0.5 + (Math.random() - 0.5) * 120,
      y: window.innerHeight * 0.5 + (Math.random() - 0.5) * 80,
      vx: (Math.random() - 0.5) * 14,
      vy: -Math.random() * 12 - 4,
      size: Math.random() * 8 + 5,
      color: colors[Math.floor(Math.random() * colors.length)],
      rotation: Math.random() * 360,
      vRot: (Math.random() - 0.5) * 12,
      opacity: 1
    });
  }

  let animFrame;
  function update() {
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    let alive = 0;
    for (const p of particles) {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.35; // gravity
      p.vx *= 0.98; // drag
      p.rotation += p.vRot;
      p.opacity -= 0.012;
      if (p.opacity > 0) {
        alive++;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rotation * Math.PI) / 180);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.opacity);
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
        ctx.restore();
      }
    }
    if (alive > 0) {
      animFrame = requestAnimationFrame(update);
    } else {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      cancelAnimationFrame(animFrame);
    }
  }
  update();
}

function showToast(msg, type = 'info') {
  const box = document.getElementById('toast-box');
  if (!box) return;

  const t = document.createElement('div');
  t.className = `toast ${type}`;

  const icon = type === 'success'
    ? 'ph-check-circle'
    : type === 'error'
    ? 'ph-warning-circle'
    : 'ph-sparkle';

  t.innerHTML = `
    <i class="ph-fill ${icon} toast-icon" aria-hidden="true"></i>
    <span>${esc(msg)}</span>
  `;

  box.appendChild(t);

  setTimeout(() => {
    t.style.opacity = '0';
    t.style.transform = 'translateY(-10px)';
    setTimeout(() => t.remove(), 250);
  }, 3200);
}

/* ============================================================
   NUMBER COUNT-UP ANIMATION (Delightful Odometer)
   ============================================================ */
function animateNumber(elem, endVal, isCurrency = true, duration = 650) {
  if (!elem) return;
  const startVal = 0;
  const startTime = performance.now();
  function tick(now) {
    const progress = Math.min((now - startTime) / duration, 1);
    const easeOut = 1 - Math.pow(1 - progress, 3);
    const current = Math.round(startVal + (endVal - startVal) * easeOut);
    elem.textContent = isCurrency ? rp(current) : current.toLocaleString('id-ID');
    if (progress < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function route() {
  const k = location.hash.slice(1) || 'dash';
  if (k === 'vault' || k === 'admin') {

  if (k !== 'new' && draft?.id) draft = null;

  ({ dash, new: newView, hist, people }[k] || dash)();
}

// Calculate real-time split shares so user sees exactly who pays what BEFORE saving
function computeLiveShares(items, tax) {
  const sub = {};
  let totalItems = 0;
  for (const it of items) {
    const price = +it.price || 0;
    const people = it.people?.length ? it.people : ['Me'];
    people.forEach(n => sub[n] = (sub[n] || 0) + (price / people.length));
    totalItems += price;
  }
  const result = {};
  for (const n in sub) {
    result[n] = Math.round(sub[n] + (totalItems ? (tax * sub[n] / totalItems) : 0));
  }
  return result;
}

function guessCategory(text) {
  const t = (text || '').toLowerCase();
  if (/coffee|cafe|resto|restaurant|warung|makan|food|bakery|kitchen|bistro|burger|pizza|sushi|tea|dimsum|beverage|kopi|nasi|mie|bakso|ayam|bebek|indomie/i.test(t)) return 'Food';
  if (/mart|supermarket|indomaret|alfamart|store|shop|mall|grocer|market|hypermart|carrefour|lottemart/i.test(t)) return 'Shopping';
  if (/gojek|grab|taxi|fuel|pertamina|transport|toll|parking|spbu|shell|bensin|bbm|bus|ojek|krl|mrt/i.test(t)) return 'Transport';
  if (/cinema|bioskop|xxi|game|ktv|fun|play|karaoke|bowling|esports/i.test(t)) return 'Fun';
  if (/pln|pdam|telkom|wifi|electric|water|bill|token|listrik|air|internet|pulsa|iuran/i.test(t)) return 'Bills';
  return 'Other';
}

function parseReceipt(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  const num = s => {
    if (!s) return 0;
    s = String(s).replace(/[^\d.,]/g, '');
    if (/[.,]\d{3}(?!\d)/.test(s)) s = s.replace(/[.,]/g, '');
    else s = s.replace(/[.,]\d{1,2}$/, '').replace(/[.,]/g, '');
    return +s || 0;
  };
  const SKIP = /subtotal|total|tunai|cash|kembali|change|bayar|payment|diskon|discount|card|debit|qris|kembalian|terima|diterima/i;
  const TAX = /pajak|ppn|tax|service|serv\.?\s*charge|pb1/i;
  let date = '', tax = 0, items = [];
  const dm = text.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if (dm) {
    let [, d, m, y] = dm;
    if (y.length === 2) y = '20' + y;
    if (+m <= 12 && +d <= 31) date = `${y}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`;
  }
  const merchantLine = lines.find(l => /[a-z]{3,}/i.test(l) && !/receipt|struk|nota|invoice|selamat/i.test(l));
  const merchant = (merchantLine || '').replace(/[^a-zA-Z0-9\s.,&-]/g, '').trim().slice(0, 50);

  for (let idx = 0; idx < lines.length; idx++) {
    const l = lines[idx];
    if (SKIP.test(l)) continue;
    if (TAX.test(l)) {
      const pm = l.match(/(?:Rp\.?\s*)?(\d[\d.,]*)\s*$/i);
      if (pm) tax += num(pm[1]);
      continue;
    }
    // Pattern: "2x Kopi 36000" or "2 x Kopi 36000"
    let m = l.match(/^(\d+)\s*[xX*]\s+(.*?)\s+(?:Rp\.?\s*)?(\d[\d.,]*)\s*$/i);
    if (m) {
      const q = Math.max(1, parseInt(m[1]) || 1);
      const name = m[2].trim();
      const p = num(m[3]);
      if (name && p > 0) {
        items.push({ name: name.slice(0, 60), qty: q, unitPrice: Math.round(p / q), price: p, people: ['Me'] });
        continue;
      }
    }
    // Standard: "Item Name 25000"
    m = l.match(/^(.*?)\s+(?:Rp\.?\s*)?(\d[\d.,]*)\s*$/i);
    if (m) {
      let label = m[1].replace(/[|_]/g, '').trim();
      let p = num(m[2]);
      if (!label || p < 100) continue;
      let q = 1;
      const qm = label.match(/^(\d+)\s+([a-zA-Z].*)/);
      if (qm && parseInt(qm[1]) < 30) {
        q = parseInt(qm[1]);
        label = qm[2].trim();
      }
      if (/[a-z]{2,}/i.test(label) && !SKIP.test(label)) {
        items.push({ name: label.slice(0, 60), qty: q, unitPrice: Math.round(p / q), price: p, people: ['Me'] });
      }
    }
  }
  const textToScan = (merchant + ' ' + items.map(i => i.name).join(' ')).trim();
  const category = guessCategory(textToScan);
  return { merchant: merchant || 'Untitled Store', date: date || new Date().toISOString().slice(0, 10), category, tax, items };
}

        <div class="split-summary-box">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
            <b style="font-size:0.9rem;">⚡ Live Split Calculation</b>
            <small style="color:var(--mute);">Taxes split proportionally</small>
          </div>
          <div>
            ${Object.keys(liveShares).map(name => `
              <div class="split-member-pill">
                <span>${esc(name)}:</span>
                <b>${rp(liveShares[name])}</b>
              </div>
            `).join('')}

        </div>
      ` : ''}

      <!-- Total & Action Buttons -->
      <div style="display:flex;justify-content:space-between;align-items:center;margin:18px 0 12px;padding-top:14px;border-top:2px dashed var(--line);">

  bindTopBarEvents();

  // Bind Events
  $('#sp').onchange = () => { playSfx('click'); sync(); draw(); };
  $('#add').onclick = () => {
    playSfx('click');
    sync();
    draft.items.push({ name: '', qty: 1, unitPrice: 0, price: 0, people: ['Me'] });
    draw();
  };

  document.querySelectorAll('.rm').forEach(b => b.onclick = () => {
    playSfx('click');
    sync();
    draft.items.splice(+b.dataset.i, 1);
    if (!draft.items.length) draft.items.push({ name: '', qty: 1, unitPrice: 0, price: 0, people: ['Me'] });
    draw();
  });

  document.querySelectorAll('.chip').forEach(b => b.onclick = () => {
    playSfx('click');
    sync();
    const p = draft.items[+b.dataset.i].people;
    const n = b.dataset.n;
    const idx = p.indexOf(n);
    if (idx < 0) p.push(n);
    else p.splice(idx, 1);
    draw();
  });

  // Live update qty/upr inputs without full redraw
  document.querySelectorAll('.qty, .upr').forEach(inp => {
    inp.oninput = () => {
      sync();
      // Update the sibling total span
      const row = inp.closest('.item-box');
      if (row) {
        const qtyEl = row.querySelector('.qty');
        const uprEl = row.querySelector('.upr');
        const totalEl = row.querySelector('.itm-total');
        if (qtyEl && uprEl && totalEl) {
          const lineTotal = Math.round(Math.max(1, parseInt(qtyEl.value) || 1) * (+uprEl.value || 0));
          totalEl.textContent = rp(lineTotal);
        }
      }
      // Recompute grand total display
      const rawItemTotal = draft.items.reduce((s, i) => s + (i.price > 0 ? +i.price : (i.qty || 1) * (+i.unitPrice || 0)), 0);
      const totalEl = document.querySelector('.mono[style*="1.6rem"]');
      if (totalEl) totalEl.textContent = rp(rawItemTotal + (+draft.tax || 0));
    };
  });
  $('#t').oninput = () => { sync(); };
  $('#m').oninput = () => { sync(); };
  $('#d').onchange = () => { sync(); };
  $('#c').onchange = () => { sync(); };

  document.querySelectorAll('.tax-preset').forEach(btn => btn.onclick = () => {
    playSfx('click');
    sync();
    const pct = +btn.dataset.pct;
    const itemSub = draft.items.reduce((s, i) => s + (i.price > 0 ? +i.price : (i.qty || 1) * (+i.unitPrice || 0)), 0);
    draft.tax = Math.round(itemSub * pct);
    draw();
  });

  if ($('#cx')) $('#cx').onclick = () => { fresh(); location.hash = '#hist'; };

  // Save Receipt
  $('#save').onclick = async () => {
    playSfx('click');
    sync();
    try {
      await api(draft.id ? `receipts/${draft.id}` : 'receipts', draft.id ? 'PUT' : 'POST', draft);
      fireConfetti();
      playSfx('success');
      showToast(draft.id ? 'Receipt updated!' : 'Receipt split and saved!', 'success');
      fresh();
      location.hash = '#hist';
    } catch (err) {
      showToast(err.message, 'error');
    }
  };

  if ($('#btn-ai-key')) {
    $('#btn-ai-key').onclick = () => {
      const cur = localStorage.getItem('splitwoi_gemini_key') || '';
      const key = prompt('Masukkan Google Gemini API Key gratis (dari https://aistudio.google.com/app/apikey) untuk AI OCR super akurat & instan:\n\n(Kosongkan jika ingin menghapus key)', cur);
      if (key !== null) {
        if (key.trim()) {
          localStorage.setItem('splitwoi_gemini_key', key.trim());
          showToast('Gemini API Key tersimpan!', 'success');
        } else {
          localStorage.removeItem('splitwoi_gemini_key');
          showToast('Gemini API Key dihapus', 'info');
        }
        draw();
      }
    };
  }

  // Auto-Scan OCR with AI + Automatic Local Tesseract Fallback
  $('#f').onchange = async e => {
    const f = e.target.files[0];
    if (!f) return;
    const hud = $('#scan-hud');
    const txt = $('#scan-txt');
    hud.style.display = 'block';
    playSfx('scan');
    txt.textContent = 'Mempersiapkan gambar... ✨';

    try {
      const dataUrl = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(f);
      });

      sync();
      let result = null;
      let usedLocal = false;

      // 1. Try Backend OCR
      txt.textContent = 'Menganalisis struk dengan AI... ✨';
      try {
        const geminiKey = localStorage.getItem('splitwoi_gemini_key') || '';
        result = await api('scan', 'POST', { image: dataUrl, geminiKey });
      } catch (apiErr) {
        console.warn('Backend AI OCR failed, falling back to local OCR:', apiErr.message);
        txt.textContent = 'Server AI OCR offline. Beralih ke scanner browser lokal...';
        usedLocal = true;
      }

      // 2. If Backend OCR returned null or error, run local Tesseract OCR
      if (!result || !result.items || !result.items.length) {
        usedLocal = true;
        if (!window.Tesseract) {
          txt.textContent = 'Memuat engine OCR lokal...';
          await new Promise((res, rej) => {
            const s = document.createElement('script');
            s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
            s.onload = res;
            s.onerror = () => rej(new Error('Gagal memuat engine OCR'));
            document.head.appendChild(s);
          });
        }

        txt.textContent = 'Membaca struk secara lokal... 0%';
        const { data } = await Tesseract.recognize(f, 'eng', {
          logger: m => {
            if (m.status === 'recognizing text') {
              txt.textContent = 'Membaca baris teks... ' + Math.round(m.progress * 100) + '%';
            }
          }
        });

        const parsed = parseReceipt(data.text);
        result = {
          merchant: parsed.merchant,
          date: parsed.date,
          category: parsed.category,
          tax: parsed.tax,
          items: parsed.items
        };
      }

      hud.style.display = 'none';

      // Pre-fill ALL form fields from OCR result
      Object.assign(draft, {
        merchant: result.merchant || draft.merchant,
        date: result.date || draft.date,
        category: result.category || draft.category,
        tax: result.tax != null ? result.tax : draft.tax,
        items: (result.items && result.items.length)
          ? result.items.map(it => ({
              name: it.name || '',
              qty: it.qty || 1,
              unitPrice: it.unitPrice || it.price || 0,
              price: it.price || Math.round((it.qty || 1) * (it.unitPrice || 0)),
              people: draft.split ? ['Me'] : []
            }))
          : draft.items
      });

      playSfx('success');
      const count = result.items?.length || 0;
      if (usedLocal) {
        showToast(count ? ('✅ Scanner lokal mendeteksi ' + count + ' item! Silakan periksa & sesuaikan.') : '⚠️ Tidak ada item terdeteksi. Silakan ketik manual.', count ? 'success' : 'info');
      } else {
        showToast(count ? ('✨ AI OCR mendeteksi ' + count + ' item! Silakan periksa & sesuaikan.') : '⚠️ Tidak ada item terdeteksi. Silakan ketik manual.', count ? 'success' : 'info');
      }
      draw();
    } catch (err) {
      hud.style.display = 'none';
      showToast('Gagal memproses struk: ' + err.message, 'error');
    }
  };
}

   SECRET ADMIN PANEL (The Vault) - THEME ADAPTIVE & CLEAN UX
   ============================================================ */
let adminSessionToken = sessionStorage.getItem('splitwoi_adm_tok') || '';
let vaultTab = 'overview';
let adminUsersCache = [];
let adminRecsCache = [];
let userSearchQuery = '';
let recSearchQuery = '';

function openVault() {
  const root = $('#vault-root');
  root.hidden = false;
  // Always fetch fresh data - never serve stale cache
  adminUsersCache = [];
  adminRecsCache = [];
  lastAdminStats = null;
  if (adminSessionToken) {
    loadAndRenderAdmin();
  } else {
    renderAdminGate();
  }
}

function closeVault() {
  $('#vault-root').hidden = true;
  if (location.hash === '#vault' || location.hash === '#admin') {
    history.replaceState(null, '', location.pathname);
  }
}

function panicLock() {
  adminSessionToken = '';
  sessionStorage.removeItem('splitwoi_adm_tok');
  closeVault();
  playSfx('click');
  showToast('Vault Locked & Hidden', 'info');
}

  const root = $('#vault-root');
  root.innerHTML = `
    <div class="vault-overlay">
      <div class="vault-modal gate-box anim-pop">
        <div style="position:absolute;top:16px;right:16px;display:flex;gap:6px;">

        <p style="color:var(--mute);font-size:0.9rem;margin:0 0 16px;">Restricted access. Enter security passkey to continue.</p>
        <div id="gate-err"></div>
        <div class="gate-input-wrap">
          <input class="gate-input" id="adm-key-input" type="password" placeholder="ENTER PASSKEY">
          <button class="gate-eye-btn" id="adm-toggle-eye" type="button" title="Show/Hide passkey">👁️</button>
        </div>
        <div style="display:flex;gap:10px;margin-top:14px;">
          <button class="acc" id="adm-unlock" style="flex:1;">Unlock Vault ⚡</button>
        </div>
        <p style="color:var(--mute);font-size:0.78rem;margin:16px 0 0;"><small>Default passkey: <code>splitwoi#admin</code></small></p>
      </div>
    </div>
  `;

  $('#gate-thm-btn').onclick = () => { toggleTheme(); renderAdminGate(); };

  const input = $('#adm-key-input');
  const eye = $('#adm-toggle-eye');
  eye.onclick = () => {
    input.type = input.type === 'password' ? 'text' : 'password';

  input.focus();
  input.onkeydown = e => { if (e.key === 'Enter') $('#adm-unlock').click(); };

  $('#adm-unlock').onclick = async () => {
    const key = input.value.trim();
    if (!key) return;
    try {
      const res = await api('admin/login', 'POST', { key });
      adminSessionToken = res.token;
      sessionStorage.setItem('splitwoi_adm_tok', res.token);
      playSfx('success');
      loadAndRenderAdmin();

      playSfx('click');
      $('#gate-err').innerHTML = `<div class="toast error" style="margin-bottom:12px;display:flex;">⚠️ ${esc(e.message)}</div>`;
    }
  };
}

// ===== Admin: Export to Excel =====
function loadSheetJS() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((resolve, reject) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    sc.onload = () => window.XLSX ? resolve(window.XLSX) : reject(new Error('Excel library failed to load'));
    sc.onerror = () => reject(new Error('Could not load Excel library (check internet connection)'));
    document.head.appendChild(sc);
  });
}

function filterAdminRecs({ query = '', from = '', to = '' } = {}) {
  const q = query.toLowerCase();
  return adminRecsCache.filter(r => {
    if (q && !((r.merchant || '').toLowerCase().includes(q) ||
               (r.user_name || '').toLowerCase().includes(q) ||
               (r.category || '').toLowerCase().includes(q))) return false;
    const d = String(r.date || '').slice(0, 10);
    if (from && d < from) return false;
    if (to && d > to) return false;
    return true;
  });
}

async function exportAdminExcel(recs, label) {
  const XLSX = await loadSheetJS();
  const num = v => Number(v) || 0;
  const itemLine = it => (it.price > 0 ? num(it.price) : num(it.qty || 1) * num(it.unitPrice));

  // Sheet 1: Receipts
  const recHead = ['Receipt ID', 'Date', 'User ID', 'User', 'Merchant', 'Category', 'Type', 'Items', 'Subtotal (Rp)', 'Tax & Service (Rp)', 'Total (Rp)'];
  const recRows = recs.map(r => {
    const items = r.items || [];
    const sub = items.reduce((a, it) => a + itemLine(it), 0);
    return [r.id, String(r.date || '').slice(0, 10), r.user_id, r.user_name || ('User #' + r.user_id),
            r.merchant || '', r.category || '', r.is_split ? 'Split' : 'Solo', items.length, sub, num(r.tax), num(r.total)];
  });
  const wsRec = XLSX.utils.aoa_to_sheet([recHead, ...recRows]);
  const last = recRows.length + 1;
  if (recRows.length) {
    XLSX.utils.sheet_add_aoa(wsRec, [['TOTAL', '', '', '', '', '', '', { t: 'n', f: `SUM(H2:H${last})` },
      { t: 'n', f: `SUM(I2:I${last})` }, { t: 'n', f: `SUM(J2:J${last})` }, { t: 'n', f: `SUM(K2:K${last})` }]], { origin: -1 });
    wsRec['!autofilter'] = { ref: `A1:K${last}` };
  }
  wsRec['!cols'] = [8, 12, 8, 18, 26, 14, 8, 8, 16, 18, 16].map(w => ({ wch: w }));
  wsRec['!freeze'] = { xSplit: 0, ySplit: 1 };

  // Sheet 2: Items
  const itemHead = ['Receipt ID', 'Date', 'User', 'Merchant', 'Category', 'Item', 'Qty', 'Unit Price (Rp)', 'Line Total (Rp)', 'Shared With'];
  const itemRows = [];
  recs.forEach(r => (r.items || []).forEach(it => {
    const q = num(it.qty || 1);
    const line = itemLine(it);
    itemRows.push([r.id, String(r.date || '').slice(0, 10), r.user_name || ('User #' + r.user_id), r.merchant || '', r.category || '',
      it.name || '', q, num(it.unitPrice) || Math.round(line / q), line, (it.people || []).join(', ')]);
  }));
  const wsItem = XLSX.utils.aoa_to_sheet([itemHead, ...itemRows]);
  if (itemRows.length) wsItem['!autofilter'] = { ref: `A1:J${itemRows.length + 1}` };
  wsItem['!cols'] = [8, 12, 18, 24, 14, 30, 6, 16, 16, 24].map(w => ({ wch: w }));

  // Sheet 3: Users
  const userHead = ['User ID', 'Name', 'Email', 'Receipts', 'Total Spent (Rp)', 'Friends', 'Debts Owed To Them (Rp)'];
  const userRows = adminUsersCache.map(u => [u.id, u.name || '', u.email || '', num(u.receipts_count), num(u.total_spent), num(u.friends_count), num(u.debts_owed)]);
  const wsUser = XLSX.utils.aoa_to_sheet([userHead, ...userRows]);
  wsUser['!cols'] = [8, 20, 30, 10, 18, 9, 24].map(w => ({ wch: w }));

  // Sheet 4: Summary (computed from the exported receipts)
  const byUser = {}, byCat = {}, byMonth = {};
  recs.forEach(r => {
    const t = num(r.total);
    const u = r.user_name || ('User #' + r.user_id);
    (byUser[u] = byUser[u] || { n: 0, t: 0 }).n++; byUser[u].t += t;
    const c = r.category || '-';
    (byCat[c] = byCat[c] || { n: 0, t: 0 }).n++; byCat[c].t += t;
    const m = String(r.date || '').slice(0, 7) || '-';
    (byMonth[m] = byMonth[m] || { n: 0, t: 0 }).n++; byMonth[m].t += t;
  });
  const block = (title, obj, sortKey) => {
    const rows = Object.entries(obj).sort((a, b) => sortKey ? a[0].localeCompare(b[0]) : b[1].t - a[1].t).map(([k, v]) => [k, v.n, v.t]);
    return [[title, 'Receipts', 'Total (Rp)'], ...rows, []];
  };
  const grand = recs.reduce((a, r) => a + num(r.total), 0);
  const sumAoa = [
    ['SplitWoi Export Report'], ['Scope', label], ['Generated', new Date().toLocaleString('id-ID')],
    ['Receipts', recs.length], ['Grand Total (Rp)', grand], [],
    ...block('By User', byUser), ...block('By Category', byCat), ...block('By Month', byMonth, true)
  ];
  const wsSum = XLSX.utils.aoa_to_sheet(sumAoa);
  wsSum['!cols'] = [{ wch: 26 }, { wch: 12 }, { wch: 18 }];

  // Number format (thousands separator) for money columns
  const fmt = (ws, cols, from, to) => {
    for (let R = from; R <= to; R++) cols.forEach(C => {
      const c = ws[XLSX.utils.encode_cell({ r: R, c: C })];
      if (c && (c.t === 'n')) c.z = '#,##0';
    });
  };
  fmt(wsRec, [8, 9, 10], 1, last);
  fmt(wsItem, [7, 8], 1, itemRows.length);
  fmt(wsUser, [4, 6], 1, userRows.length);
  fmt(wsSum, [2], 0, sumAoa.length);

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, wsSum, 'Summary');
  XLSX.utils.book_append_sheet(wb, wsRec, 'Receipts');
  XLSX.utils.book_append_sheet(wb, wsItem, 'Items');
  XLSX.utils.book_append_sheet(wb, wsUser, 'Users');
  XLSX.writeFile(wb, `splitwoi-export-${new Date().toISOString().slice(0, 10)}.xlsx`);
}

async function runAdminExcel(btn, recs, label) {
  if (!recs.length) { showToast('No receipts to export', 'error'); return; }
  const old = btn.innerHTML;
  btn.disabled = true; btn.innerHTML = '⏳ Building Excel...';
  try {
    await exportAdminExcel(recs, label);
    showToast(`Exported ${recs.length} receipts to Excel`, 'success');
  } catch (e) {
    alert('Excel export failed: ' + e.message);
  } finally {
    btn.disabled = false; btn.innerHTML = old;
  }
}

  if (recSearch) {
    recSearch.oninput = e => {
      recSearchQuery = e.target.value;

      playSfx('click');

      const newPass = prompt(`Enter new password for ${name} (minimum 6 characters):`, 'SplitWoi123!');
      if (!newPass) return;
      try {
        await api(`admin/users/${btn.dataset.id}/reset`, 'POST', { password: newPass }, { 'x-admin-token': adminSessionToken });
        alert(`Password for ${name} has been reset to: ${newPass}`);

    playSfx('click');
    const label = recSearchQuery ? `Search: "${recSearchQuery}"` : 'All receipts';
    runAdminExcel(e.currentTarget, filterAdminRecs({ query: recSearchQuery }), label);
  });

  // Export JSON Backup
  $('#adm-export-btn')?.addEventListener('click', async () => {
    playSfx('click');
    try {
      const data = await api('admin/export', 'GET', null, { 'x-admin-token': adminSessionToken });
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `splitwoi-backup-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Database exported successfully!', 'success');
    } catch (e) {
      alert('Export failed: ' + e.message);
    }
  });

  // Clean Stale Sessions
  $('#adm-clean-sessions-btn')?.addEventListener('click', async () => {
    playSfx('click');
    try {
      const res = await api('admin/clean-sessions', 'POST', {}, { 'x-admin-token': adminSessionToken });
      alert(`Cleanup complete! Removed ${res.cleaned || 0} stale sessions.`);
      loadAndRenderAdmin();
    } catch (e) {
      alert('Clean sessions failed: ' + e.message);
    }
  });
}
// Global Secret Key Listener: Ctrl+Shift+A or typing "admin"
let keySequence = '';
window.addEventListener('keydown', e => {
  // ESC triggers Panic Lock if Vault is open
  if (e.key === 'Escape' && !$('#vault-root').hidden) {
    panicLock();
    return;
  }

  // Ctrl + Shift + A or Cmd + Shift + A
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'A' || e.key === 'a')) {
    e.preventDefault();
    openVault();
    return;
  }

  // Typing easter egg: 'admin'
  if (e.key.length === 1 && !['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
    keySequence += e.key.toLowerCase();
    if (keySequence.length > 10) keySequence = keySequence.slice(-10);
    if (keySequence.endsWith('admin')) {
      keySequence = '';
      openVault();
    }
  }
});

/* ============================================================
   START APPLICATION
   ============================================================ */
boot();
</script>
</body>
