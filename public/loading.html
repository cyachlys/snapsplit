
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SplitWoi! Loading</title>

    <link rel="stylesheet" href="loading.css">
</head>
<body>

    <div class="lw-card">

        <!-- Receipt -->
        <div class="lw-receipt-wrap">

            <div class="lw-receipt">
                <div class="lw-line lw-long"></div>
                <div class="lw-line lw-mid"></div>
                <div class="lw-line lw-short"></div>
                <div class="lw-line lw-long"></div>

                <div class="lw-divider"></div>

                <div class="lw-total">
                    <span>TOTAL</span>
                    <strong>Rp 150.000</strong>
                </div>
            </div>

            <!-- Green Logo -->
            <div class="lw-logo-badge">
                <svg viewBox="0 0 64 64">
                    <path d="M12 9h40a4 4 0 0 1 4 4v39l-9-5-9 5-9-5-9 5V13a4 4 0 0 1 4-4Z"
                        fill="#19191d"/>
                    <path d="M23 25h18M23 34h18"
                        stroke="#C6FF3D"
                        stroke-width="4"
                        stroke-linecap="round"/>
                </svg>
            </div>

        </div>

        <!-- Brand -->
        <div class="lw-brand">
            <h1>SplitWoi<span>!</span></h1>
            <p>Making money splitting easier.</p>
        </div>

        <!-- Loading Bar -->
        <div class="lw-loading-bar">
            <div class="lw-loading-progress"></div>
        </div>

    </div>

    <script src="loading.js"></script>

</body>
</html>
